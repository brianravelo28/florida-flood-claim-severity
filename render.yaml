# Render Blueprint: New + -> Blueprint -> pick this repo.
services:
  - type: web
    name: florida-flood-claim-severity
    runtime: python
    plan: starter  # Starter: stays awake (no cold starts); 512 MB RAM
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn wsgi:application --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.8
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MALLOC_ARENA_MAX
        value: "2"
